# Copy this file to application-secret.properties and fill your local secrets.
# Keep application-secret.properties out of source control.

google.gemini.api-key.local=YOUR_GEMINI_API_KEY

# SMTP config for OTP email sending
MAIL_HOST=smtp.gmail.com
MAIL_PORT=587
MAIL_USERNAME=your-gmail-address@gmail.com
MAIL_PASSWORD=your-gmail-app-password
MAIL_SMTP_AUTH=true
MAIL_SMTP_STARTTLS=true
MAIL_FROM=BookStore <your-gmail-address@gmail.com>
