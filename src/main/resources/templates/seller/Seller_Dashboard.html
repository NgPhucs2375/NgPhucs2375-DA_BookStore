<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/panel_head :: head('BOOKOM SELLER - Tong quan', false)}"></head>
<body class="font-sans bg-[#fbfaf8] text-[#5D4037]">
<div class="flex min-h-screen">
    <div th:replace="~{fragments/seller_layout :: sidebar(${activeMenu})}"></div>
    <div class="flex-1 min-w-0">
        <div th:replace="~{fragments/seller_layout :: header(${pageTitle}, ${pageSubtitle})}"></div>
        <main class="p-4 md:p-8 space-y-6">
            <section class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
                <div class="flex items-center gap-3">
                    <select id="seller-period-filter" class="rounded-xl border border-[#E5CBB5] bg-white px-4 py-2 text-sm font-bold text-[#5D4037]">
                        <option value="7">7 ngày</option>
                        <option value="30" selected>30 ngày</option>
                        <option value="90">90 ngày</option>
                    </select>
                    <button id="seller-refresh-btn" class="rounded-xl bg-[#5D4037] px-4 py-2 text-sm font-black text-white">Refresh</button>
                </div>
            </section>
            <section class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-5 gap-4 md:gap-6">
                <article class="rounded-xl border border-[#E5CBB5] bg-white p-5"><p class="text-sm font-black text-[#5D4037]/70">Tổng doanh thu</p><p id="seller-metric-revenue" class="mt-2 text-2xl md:text-3xl font-black">--</p></article>
                <article class="rounded-xl border border-[#E5CBB5] bg-white p-5"><p class="text-sm font-black text-[#5D4037]/70">Đơn hoàn thành</p><p id="seller-metric-completed" class="mt-2 text-2xl md:text-3xl font-black">--</p></article>
                <article class="rounded-xl border border-[#E5CBB5] bg-white p-5"><p class="text-sm font-black text-[#5D4037]/70">AOV</p><p id="seller-metric-aov" class="mt-2 text-2xl md:text-3xl font-black">--</p></article>
                <article class="rounded-xl border border-[#E5CBB5] bg-white p-5"><p class="text-sm font-black text-[#5D4037]/70">Tỷ lệ hoàn thành</p><p id="seller-metric-rate" class="mt-2 text-2xl md:text-3xl font-black">--</p></article>
                <article class="rounded-xl border border-[#E5CBB5] bg-[#FAF5E8] p-5"><p class="text-sm font-black text-[#5D4037]/70">Sản phẩm đã bán</p><p id="seller-metric-units" class="mt-2 text-2xl md:text-3xl font-black text-[#ea580c]">--</p></article>
            </section>
        </main>
    </div>
</div>
<script th:src="@{/js/panel-data.js}"></script>
<script th:src="@{/js/api-service.js}"></script>
<script th:src="@{/js/seller-dashboard-integration.js}"></script>
<script>
// Load seller dashboard with new API integration
if (typeof loadSellerDashboard === 'function') {
    loadSellerDashboard();
} else {
    BookomPanelData.initSellerDashboard();
}
</script>
</body>
</html>
