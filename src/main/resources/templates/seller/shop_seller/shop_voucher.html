<section th:fragment="shop_voucher(vouchers)" 
         xmlns:th="http://www.thymeleaf.org"
         class="max-w-[1400px] mx-auto px-6 pt-10 pb-4">
    <div class="flex items-center gap-2 mb-6">
        <svg class="w-6 h-6 text-brand-orange" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path>
        </svg>
        <h2 class="text-xl font-bold text-brand-dark uppercase tracking-wide">Mã Giảm Giá Của Shop</h2>
    </div>

    <div th:if="${#lists.isEmpty(vouchers)}" 
         class="text-center py-8 text-gray-400 font-semibold border-2 border-dashed border-brand-border rounded-xl">
        Shop chưa có mã giảm giá nào.
    </div>

    <div th:unless="${#lists.isEmpty(vouchers)}" 
         class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div th:each="v : ${vouchers}" 
             th:insert="~{fragments/voucher_card :: voucher_card(coupon=${v})}"></div>
    </div>
</section>
