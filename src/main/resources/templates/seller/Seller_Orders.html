<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/panel_head :: head('BOOKOM SELLER - Don hang', false)}"></head>
<body class="font-sans bg-[#fbfaf8] text-[#5D4037]">
<div class="flex min-h-screen">
    <div th:replace="~{fragments/seller_layout :: sidebar(${activeMenu})}"></div>
    <div class="flex-1 min-w-0 flex flex-col">
        <div th:replace="~{fragments/seller_layout :: header(${pageTitle}, ${pageSubtitle})}"></div>
        <main class="p-4 md:p-8 space-y-8 flex-grow">
            <!-- Order Header & Stats -->
            <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
                <div>
                </div>
                
                <!-- Date Filter -->
                <div class="flex items-center gap-2 bg-white border border-[#E5CBB5] rounded-xl p-1 shadow-sm">
                    <div class="flex items-center gap-2 px-3 py-2 border-r border-[#E5CBB5]">
                        <svg class="w-4 h-4 text-[#5D4037]/50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <input type="date" id="date-from" class="text-xs font-bold outline-none bg-transparent">
                    </div>
                    <span class="text-[10px] font-black text-[#5D4037]/40 px-1">Đến</span>
                    <div class="flex items-center gap-2 px-3 py-2">
                        <svg class="w-4 h-4 text-[#5D4037]/50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <input type="date" id="date-to" class="text-xs font-bold outline-none bg-transparent">
                    </div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="flex items-center gap-8 border-b border-[#E5CBB5]">
                <button onclick="filterByStatus('ALL')" class="order-tab active pb-4 text-sm font-black text-[#5D4037] border-b-2 border-[#5D4037] transition-all">Tất cả đơn</button>
                <button onclick="filterByStatus('SHIPPING')" class="order-tab pb-4 text-sm font-bold text-[#5D4037]/50 hover:text-[#5D4037] border-b-2 border-transparent transition-all">Đang giao</button>
                <button onclick="filterByStatus('PENDING_PAYMENT')" class="order-tab pb-4 text-sm font-bold text-[#5D4037]/50 hover:text-[#5D4037] border-b-2 border-transparent transition-all">Chờ xử lý</button>
                <button onclick="filterByStatus('COMPLETED')" class="order-tab pb-4 text-sm font-bold text-[#5D4037]/50 hover:text-[#5D4037] border-b-2 border-transparent transition-all">Đã hoàn thành</button>
            </div>

            <!-- Table Container -->
            <div class="bg-white rounded-2xl shadow-premium border border-[#E5CBB5] overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-[11px] font-black text-[#5D4037]/40 uppercase tracking-wider border-b border-[#FAF5E8]">
                                <th class="px-6 py-5">Mã Đơn <svg class="inline w-3 h-3 ml-1" fill="currentColor" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"></path></svg></th>
                                <th class="px-6 py-5">Khách hàng</th>
                                <th class="px-6 py-5">Địa chỉ</th>
                                <th class="px-6 py-5">Ngày đặt <svg class="inline w-3 h-3 ml-1" fill="currentColor" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"></path></svg></th>
                                <th class="px-6 py-5 text-right">Tổng tiền <svg class="inline w-3 h-3 ml-1" fill="currentColor" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"></path></svg></th>
                                <th class="px-6 py-5">Trạng thái</th>
                                <th class="px-6 py-5 text-center">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="seller-orders-body" class="divide-y divide-[#FAF5E8]">
                            <!-- Rows will be injected by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Pagination -->
            <div class="flex items-center justify-between pt-4">
                <p class="text-xs font-bold text-[#5D4037]/40">Showing <span id="pagination-range">0-0 of 0</span></p>
                <div class="flex items-center gap-2" id="pagination-controls">
                    <!-- Pagination buttons injected by JS -->
                </div>
            </div>
        </main>
    </div>

<style>
.shadow-premium {
    box-shadow: 0 10px 30px -5px rgba(93, 64, 55, 0.05);
}
.order-tab.active {
    color: #5D4037;
    border-color: #5D4037;
}
.status-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-right: 8px;
}
</style>
</div>
<script th:src="@{/js/panel-data.js}"></script>
<script th:src="@{/js/api-service.js}"></script>
<script>
// Load seller orders with new API integration
if (typeof loadSellerOrders === 'function') {
    loadSellerOrders();
} else {
    BookomPanelData.initSellerOrders();
}
</script>
</body>
</html>
