<aside th:fragment="sidebar(activeMenu)" 
       id="seller-sidebar"
       class="fixed inset-y-0 left-0 z-50 w-72 bg-[#5D4037] border-r border-black/10 transition-transform duration-300 transform -translate-x-full lg:translate-x-0 lg:static lg:flex lg:flex-col">
    <div class="h-20 px-6 flex items-center justify-between border-b border-white/10 lg:hidden">
        <span class="text-xl font-black tracking-tight text-white">
            BOOKOM <span class="text-[#F8D9C0] text-sm align-middle">SELLER</span>
        </span>
        <button onclick="toggleSidebar()" class="text-white/70 hover:text-white">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>
    <div class="h-20 px-6 hidden lg:flex items-center border-b border-white/10">
        <a th:href="@{/seller/dashboard}" class="text-xl md:text-2xl font-black tracking-tight text-white">
            BOOKOM <span class="text-[#F8D9C0] text-sm align-middle">SELLER</span>
        </a>
    </div>
    <nav class="px-4 mt-6 space-y-1.5 text-sm font-extrabold tracking-wide overflow-y-auto flex-grow">
        <a th:href="@{/seller/shop}" class="flex items-center gap-3 rounded-xl px-4 py-3 transition group"
           th:classappend="${activeMenu == 'seller-shop'} ? ' bg-[#D19C74] text-white shadow-md' : ' text-[#FAF5E8]/70 hover:bg-white/5 hover:text-white'">
            <svg class="w-5 h-5 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            Trang chủ
        </a>
        <a th:href="@{/seller/dashboard}" class="flex items-center gap-3 rounded-xl px-4 py-3 transition group"
           th:classappend="${activeMenu == 'seller-dashboard'} ? ' bg-[#D19C74] text-white shadow-md' : ' text-[#FAF5E8]/70 hover:bg-white/5 hover:text-white'">
            <svg class="w-5 h-5 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
            Tổng quan
        </a>
        <a th:href="@{/seller/orders}" class="flex items-center gap-3 rounded-xl px-4 py-3 transition group"
           th:classappend="${activeMenu == 'seller-orders'} ? ' bg-[#D19C74] text-white shadow-md' : ' text-[#FAF5E8]/70 hover:bg-white/5 hover:text-white'">
            <svg class="w-5 h-5 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
            Đơn hàng
        </a>
        <a th:href="@{/seller/inventory}" class="flex items-center gap-3 rounded-xl px-4 py-3 transition group"
           th:classappend="${activeMenu == 'seller-inventory'} ? ' bg-[#D19C74] text-white shadow-md' : ' text-[#FAF5E8]/70 hover:bg-white/5 hover:text-white'">
            <svg class="w-5 h-5 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
            Kho hàng
        </a>
        <a th:href="@{/seller/analytics}" class="flex items-center gap-3 rounded-xl px-4 py-3 transition group"
           th:classappend="${activeMenu == 'seller-analytics'} ? ' bg-[#D19C74] text-white shadow-md' : ' text-[#FAF5E8]/70 hover:bg-white/5 hover:text-white'">
            <svg class="w-5 h-5 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            Doanh thu
        </a>
        <a th:href="@{/seller/vouchers}" class="flex items-center gap-3 rounded-xl px-4 py-3 transition group"
           th:classappend="${activeMenu == 'seller-vouchers'} ? ' bg-[#D19C74] text-white shadow-md' : ' text-[#FAF5E8]/70 hover:bg-white/5 hover:text-white'">
            <svg class="w-5 h-5 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path></svg>

<header th:fragment="header(pageTitle, pageSubtitle)" class="h-20 bg-white border-b border-[#E5CBB5] px-4 md:px-8 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center gap-6">
        <div class="hidden md:block">
            <h1 class="text-lg font-black text-[#5D4037]" th:text="${pageTitle}">Quan ly kho hang</h1>
        </div>
    </div>
    
    <div class="flex items-center gap-4">
        <a th:href="@{/}" class="hidden md:inline-flex text-sm font-black text-[#5D4037]/70 hover:text-[#5D4037] transition">Về trang mua sắm</a>
        
        <!-- User Dropdown -->
        <div class="relative" id="user-dropdown-container">
            <button onclick="toggleUserDropdown()" class="flex items-center gap-3 p-1 rounded-full hover:bg-[#FAF5E8] transition border border-transparent hover:border-[#E5CBB5]">
                <div class="h-10 w-10 rounded-full bg-[#D19C74] text-white flex items-center justify-center text-xs font-black shadow-sm overflow-hidden">
                    <span id="user-initials">SL</span>
                </div>
                <svg class="w-4 h-4 text-[#5D4037]/70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>
            
            <!-- Dropdown Menu -->
            <div id="user-dropdown-menu" class="hidden absolute right-0 mt-2 w-48 bg-white border border-[#E5CBB5] rounded-xl shadow-xl overflow-hidden py-2 z-50">
                <a th:href="@{/seller/shop}" class="flex items-center gap-3 px-4 py-2 text-sm font-bold text-[#5D4037] hover:bg-[#FAF5E8] transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    Hồ sơ shop
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-2 text-sm font-bold text-[#5D4037] hover:bg-[#FAF5E8] transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    Đổi mật khẩu
                </a>
                <div class="border-t border-[#E5CBB5] my-1"></div>
                <button onclick="window.bookomSellerLogout && window.bookomSellerLogout()" class="w-full flex items-center gap-3 px-4 py-2 text-sm font-bold text-red-600 hover:bg-red-50 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    Đăng xuất
                </button>
            </div>
        </div>
    </div>
</header>

<script>
function toggleSidebar() {
    const sidebar = document.getElementById('seller-sidebar');
    if (sidebar) {
        sidebar.classList.toggle('-translate-x-full');
    }
}

function toggleUserDropdown() {
    const menu = document.getElementById('user-dropdown-menu');
    if (menu) {
        menu.classList.toggle('hidden');
    }
}

// Close dropdown when clicking outside
window.addEventListener('click', function(e) {
    const container = document.getElementById('user-dropdown-container');
    const menu = document.getElementById('user-dropdown-menu');
    if (container && menu && !container.contains(e.target)) {
        menu.classList.add('hidden');
    }
});

if (!window.bookomSellerLogout) {
    window.bookomSellerLogout = () => {
        localStorage.removeItem('userId');
        localStorage.removeItem('accessToken');
        localStorage.removeItem('userRole');
        window.location.href = '/';
    };
}

// Update initials from localStorage if available
document.addEventListener('DOMContentLoaded', () => {
    const shopName = localStorage.getItem('shopName');
    if (shopName) {
        const initials = shopName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        const el = document.getElementById('user-initials');
        if (el) el.textContent = initials;
    }
});
</script>
