version: '3.8'

services:
  # =========================================
  # 1. HẠ TẦNG CƠ SỞ (DATABASE, CACHE, QUEUE)
  # =========================================
  bookom-postgres:
    image: postgres:15-alpine
    container_name: bookom-postgres
    environment:
      POSTGRES_DB: BookstoreDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Bookom123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bookom-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d BookstoreDB"]
      interval: 10s
      timeout: 5s
      retries: 5

  bookom-redis:
    image: redis:7-alpine
    container_name: bookom-redis
    ports:
      - "6379:6379"
    networks:
      - bookom-network

  bookom-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bookom-rabbitmq
    ports:
      - "5672:5672"   # Cổng giao tiếp cho Spring Boot
      - "15672:15672" # Cổng giao diện web quản lý RabbitMQ (truy cập localhost:15672)
    networks:
      - bookom-network

  # =========================================
  # 2. ỨNG DỤNG VÀ LOAD BALANCER
  # =========================================
  nginx-lb:
    image: nginx:alpine
    container_name: bookom-nginx-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - bookom-app-1
      - bookom-app-2
      - bookom-app-3
    networks:
      - bookom-network

  bookom-app-1:
    image: eclipse-temurin:17-jdk-alpine
    container_name: bookom-app-1
    depends_on:
      bookom-postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://bookom-postgres:5432/BookstoreDB
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Bookom123
      SPRING_DATA_REDIS_HOST: bookom-redis
      SPRING_RABBITMQ_HOST: bookom-rabbitmq
    volumes:
      - ./target/BookStore-0.0.1-SNAPSHOT.jar:/app/bookom.jar
    command: ["java", "-jar", "/app/bookom.jar"]
    networks:
      - bookom-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  bookom-app-2:
    image: eclipse-temurin:17-jdk-alpine
    container_name: bookom-app-2
    depends_on:
      bookom-postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://bookom-postgres:5432/BookstoreDB
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Bookom123
      SPRING_DATA_REDIS_HOST: bookom-redis
      SPRING_RABBITMQ_HOST: bookom-rabbitmq
    volumes:
      - ./target/BookStore-0.0.1-SNAPSHOT.jar:/app/bookom.jar
    command: ["java", "-jar", "/app/bookom.jar"]
    networks:
      - bookom-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  bookom-app-3:
    image: eclipse-temurin:17-jdk-alpine
    container_name: bookom-app-3
    depends_on:
      bookom-postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://bookom-postgres:5432/BookstoreDB
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Bookom123
      SPRING_DATA_REDIS_HOST: bookom-redis
      SPRING_RABBITMQ_HOST: bookom-rabbitmq
    volumes:
      - ./target/BookStore-0.0.1-SNAPSHOT.jar:/app/bookom.jar
    command: ["java", "-jar", "/app/bookom.jar"]
    networks:
      - bookom-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  bookom-network:
    driver: bridge

volumes:
  postgres-data: