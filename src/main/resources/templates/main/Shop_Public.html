<!DOCTYPE html>
<html lang="vi" class="scroll-smooth" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOKOM - Cửa hàng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/flowbite@1.7.0/dist/flowbite.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-brown': '#cda27a',
                        'brand-brown-dark': '#b58d67',
                        'brand-dark': '#4a3b32',
                        'brand-hero': '#f4d9c0',
                        'brand-bg': '#fbfaf8',
                        'brand-orange': '#d96a4a',
                        'brand-border': '#eaddcf',
                    },
                    fontFamily: {
                        sans: ['Quicksand', 'sans-serif'],
                    },
                    boxShadow: {
                        'premium': '0 4px 20px -2px rgba(74, 59, 50, 0.08)',
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #fbfaf8; }
        ::-webkit-scrollbar-thumb { background: #cda27a; border-radius: 10px; }
        .book-cover { transition: transform 0.6s ease; }
        .product-card:hover .book-cover { transform: scale(1.05) rotate(-1deg); }
        .shop-banner-mask { background: linear-gradient(to top, rgba(74, 59, 50, 0.9) 0%, rgba(74, 59, 50, 0.4) 50%, rgba(74, 59, 50, 0.1) 100%); }
    </style>
</head>
<body class="bg-brand-bg font-sans text-brand-dark flex flex-col min-h-screen">

<div id="shop-host" th:attr="data-slug=${shopSlug}" style="display:none"></div>

<header class="bg-white sticky top-0 z-50 shadow-sm border-b border-brand-border">
    <div class="max-w-[1400px] mx-auto px-6 py-4 flex items-center justify-between gap-8">
        <a th:href="@{/}" class="text-3xl font-extrabold tracking-tighter text-brand-dark hover:opacity-90 transition flex items-center gap-2">
            <div class="bg-brand-brown text-white p-1.5 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                </svg>
            </div>
            BOOKOM
        </a>
        <div class="flex items-center gap-6 text-brand-dark">
            <a th:href="@{/main/cart}" class="hover:text-brand-brown font-bold text-sm">Giỏ hàng</a>
            <a th:href="@{/main/auth}" class="hover:text-brand-brown font-bold text-sm">Đăng nhập</a>
        </div>
    </div>
</header>

<main class="flex-grow">
    <section class="bg-white border-b border-brand-border relative">
        <div id="shop-banner-host" class="w-full h-48 md:h-64 relative overflow-hidden bg-brand-dark">
            <div class="absolute inset-0 bg-brand-brown opacity-20"></div>
            <div class="absolute inset-0 shop-banner-mask"></div>
        </div>

        <div class="max-w-[1400px] mx-auto px-6 relative">
            <div class="flex flex-col md:flex-row items-end md:items-center gap-6 md:gap-10 -mt-16 md:-mt-20 pb-8 relative z-10">
                <div class="bg-white p-4 md:p-6 rounded-xl shadow-premium flex flex-col sm:flex-row items-center sm:items-start gap-6 w-full md:w-auto border border-brand-border">
                    <div class="w-28 h-28 rounded-full bg-brand-hero border-4 border-white shadow-md flex-shrink-0 flex items-center justify-center overflow-hidden">
                        <img id="shop-display-logo" src="" alt="Shop Logo" class="w-full h-full object-cover hidden" />
                        <div id="shop-display-initials" class="text-brand-brown font-extrabold text-3xl">...</div>
                    </div>

                    <div class="flex flex-col justify-center items-center sm:items-start text-center sm:text-left pt-2">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="bg-brand-orange text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider">Gian hàng chính hãng</span>
                            <h1 id="shop-display-name" class="text-2xl md:text-3xl font-bold text-brand-dark">Đang tải...</h1>
                        </div>
                        <p id="shop-display-desc" class="text-sm text-gray-500 font-medium mb-4 max-w-md line-clamp-2">...</p>

                        <button class="bg-brand-brown text-white text-sm font-bold px-8 py-2 rounded-lg hover:bg-brand-brown-dark transition-colors shadow-sm uppercase">
                            + Theo dõi
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="bg-white py-10 border-y border-brand-border mt-6">
        <div class="max-w-[1400px] mx-auto px-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-brand-dark tracking-wide uppercase">Sản Phẩm Của Shop</h2>
            </div>

            <div id="public-books-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                <p class="text-gray-500 font-bold col-span-full">Đang tải sản phẩm...</p>
            </div>
        </div>
    </section>
</main>

<footer class="bg-white border-t-4 border-brand-brown pt-8 pb-8 mt-12">
    <div class="max-w-[1400px] mx-auto px-6 text-center text-sm font-bold text-gray-500">
        <div>© 2026 BOOKOM. All rights reserved.</div>
    </div>
</footer>

<script>
    (async function() {
        const host = document.getElementById('shop-host');
        if (!host) return;
        const slug = host.dataset.slug;
        if (!slug) {
            document.getElementById('shop-display-name').textContent = 'Cửa hàng không tồn tại';
            return;
        }

        try {
            // 1. Tải thông tin Shop
            const res = await fetch('/api/shops/' + encodeURIComponent(slug));
            if (!res.ok) throw new Error('Không tải được cửa hàng');
            const shop = await res.json();

            document.getElementById('shop-display-name').textContent = shop.shopName || 'Cửa hàng';
            document.getElementById('shop-display-desc').textContent = shop.description || 'Cửa hàng uy tín trên Bookom';

            // Hiển thị logo (ưu tiên ảnh, fallback về chữ cái đầu)
            const logoImg = document.getElementById('shop-display-logo');
            const initialsEl = document.getElementById('shop-display-initials');
            const initials = (shop.shopName || 'NN').trim().split(/\s+/).slice(0, 2).map(p => p[0].toUpperCase()).join('');
            initialsEl.textContent = initials;

            if (shop.logoUrl) {
                logoImg.src = shop.logoUrl;
                logoImg.classList.remove('hidden');
                initialsEl.classList.add('hidden');
            } else {
                logoImg.classList.add('hidden');
                initialsEl.classList.remove('hidden');
            }

            if (shop.bannerUrl) {
                const banner = document.getElementById('shop-banner-host');
                banner.style.backgroundImage = `url('${shop.bannerUrl}')`;
                banner.style.backgroundSize = 'cover';
                banner.style.backgroundPosition = 'center';
            }

            // 2. Tải Sách của Shop (Gọi qua API Search Public)
            const sellerId = shop.sellerId || (shop.seller && shop.seller.id) || shop.id;
            const bookRes = await fetch(`/api/books/search?sellerIds=${sellerId}&size=50`);
            const booksContainer = document.getElementById('public-books-container');

            if(bookRes.ok) {
                const bookData = await bookRes.json();
                const books = bookData.content || bookData || [];

                if(books.length === 0) {
                    booksContainer.innerHTML = '<p class="text-gray-500 font-bold col-span-full">Shop này chưa đăng bán sản phẩm nào.</p>';
                } else {
                    booksContainer.innerHTML = books.map(book => {
                        const coverUrl = book.imageUrl || book.coverImageUrl || '/images/covers/default.jpg';
                        const price = book.price ? book.price.toLocaleString('vi-VN') + 'đ' : '0đ';
                        return `
                        <a href="/books/${book.id}" class="product-card group p-3 border border-brand-border rounded-xl hover:shadow-md transition-shadow bg-white flex flex-col h-full cursor-pointer">
                            <img src="${coverUrl}" class="w-full h-44 object-cover rounded-lg mb-3 book-cover">
                            <h3 class="text-sm font-bold line-clamp-2 mb-1 flex-grow group-hover:text-brand-brown transition-colors">${book.title}</h3>
                            <div class="text-brand-orange font-bold mt-2">${price}</div>
                        </a>`;
                    }).join('');
                }
            } else {
                booksContainer.innerHTML = '<p class="text-red-500 font-bold col-span-full">Không thể tải danh sách sản phẩm.</p>';
            }

        } catch (e) {
            console.error(e);
            document.getElementById('shop-display-name').textContent = 'Lỗi tải cửa hàng';
            document.getElementById('public-books-container').innerHTML = '<p class="text-red-500 font-bold col-span-full">Có lỗi xảy ra khi tải dữ liệu.</p>';
        }
    })();
</script>
</body>
</html>
