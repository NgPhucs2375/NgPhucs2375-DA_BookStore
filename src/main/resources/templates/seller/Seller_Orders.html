<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/panel_head :: head('BOOKOM SELLER - Don hang', false)}"></head>
<body class="font-sans bg-[#fbfaf8] text-[#5D4037]">
<div class="flex min-h-screen">
    <div th:replace="~{fragments/seller_layout :: sidebar(${activeMenu})}"></div>
    <div class="flex-1 min-w-0">
        <div th:replace="~{fragments/seller_layout :: header(${pageTitle}, ${pageSubtitle})}"></div>
        <main class="p-4 md:p-8 space-y-6">
            <section class="rounded-xl border border-[#E5CBB5] bg-white p-4 flex flex-col gap-3 lg:flex-row lg:items-end lg:justify-between">
                <div>
                    <p class="text-sm font-black text-[#5D4037]/60">Dùng chung nguồn với dashboard doanh thu</p>
                    <h2 class="text-xl font-black text-[#5D4037]">Giao dịch gần đây</h2>
                </div>
                <div class="flex flex-col md:flex-row gap-3 md:items-center w-full lg:w-auto">
                    <input id="orders-q" class="rounded-lg border border-[#E5CBB5] px-3 py-2 font-bold w-full md:w-80" placeholder="Tìm mã GD/khách/sản phẩm">
                    <select id="orders-period" class="rounded-lg border border-[#E5CBB5] px-3 py-2 font-bold">
                        <option value="7">7 ngày</option>
                        <option value="30" selected>30 ngày</option>
                        <option value="90">90 ngày</option>
                    </select>
                    <button id="orders-refresh" class="rounded-lg bg-[#5D4037] px-4 py-2 font-black text-white">Refresh</button>
                </div>
            </section>
            <section class="rounded-xl border border-[#E5CBB5] bg-white overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-[#FAF5E8] text-[#5D4037]/70">
                        <tr>
                            <th class="px-4 py-3 font-black">Mã GD</th>
                            <th class="px-4 py-3 font-black">Ngày</th>
                            <th class="px-4 py-3 font-black">Khách hàng</th>
                            <th class="px-4 py-3 font-black">Sản phẩm</th>
                            <th class="px-4 py-3 font-black">SL</th>
                            <th class="px-4 py-3 font-black">Thành tiền</th>
                            <th class="px-4 py-3 font-black">Thanh toán</th>
                        </tr>
                        </thead>
                        <tbody id="seller-orders-body" class="divide-y divide-[#E5CBB5]"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>
<script th:src="@{/js/panel-data.js}"></script>
<script th:src="@{/js/api-service.js}"></script>
<script>
// Load seller orders with new API integration
if (typeof loadSellerOrders === 'function') {
    loadSellerOrders();
} else {
    BookomPanelData.initSellerOrders();
}
</script>
</body>
</html>
